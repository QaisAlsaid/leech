[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leech"
version = "0.4.1-beta"
requires-python = ">=3.13"
dependencies = [
    "discord.py-self==2.1.0",
    "python-dotenv==1.2.4",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "Pillow==12.3.0",
    "soundfile"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --maxfail=1"
pythonpath = ["src", "."]
